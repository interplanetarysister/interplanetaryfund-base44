name: Retire Consolidated Base44 Source

on:
  push:
    paths:
      - RETIRE_AFTER_CONSOLIDATION.md

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove transferred source files
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cat > README.md <<'EOF'
          # Interplanetary Fund Base44 — Consolidated

          This repository's source was transferred into `interplanetary-fund` as part of the Interplanetary Fund product consolidation.

          The canonical product repositories are now:
          - `interplanetarysister/InterplanetaryFund` — Frontend
          - `interplanetarysister/interplanetary-fund-backend` — Backend
          - `interplanetarysister/interplanetary-fund` — Migration/combined source

          This repository is retained only as a Git history container. No active product source remains here.
          EOF
          rm -f RETIRE_AFTER_CONSOLIDATION.md

      - name: Commit retirement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Retire source files after consolidation" || exit 0
          git push
