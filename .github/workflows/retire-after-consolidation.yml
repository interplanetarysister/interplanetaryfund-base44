# Manual-only legacy workflow. IFund2 owns all production work.
name: "Authoritative IFund web readiness (manual)"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check published website without changing anything
        run: |
          set -euo pipefail
          curl -fsSL --max-time 20 https://interplanetaryfund.com/ -o /tmp/ifund.html
          grep -Eiq '<html|<!doctype' /tmp/ifund.html
